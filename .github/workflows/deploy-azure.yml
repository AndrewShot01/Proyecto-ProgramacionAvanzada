name: Publicar en Azure
on:
  workflow_run:
    workflows: ['Validar proyecto']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: publicacion-azure
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pulperia-web
          path: publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
      - name: Comprobar respuesta pública
        env:
          APP_URL: ${{ vars.AZURE_WEBAPP_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "$APP_URL/health"
