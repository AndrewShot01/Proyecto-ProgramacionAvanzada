name: Publicar en Azure
on:
  workflow_run:
    workflows: ['Validar primer entregable']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pulperia-web
          path: publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
